<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recruiter Dashboard | ResumeMatch</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1870/1870080.png">
</head>
<body>

<nav class="navbar">
  <div class="logo">ResumeMatch</div>
  <div class="nav-buttons">
    <a href="index.html" class="nav-button">Home</a>
    <button type="button" class="nav-button" onclick="logout()">Logout</button>
  </div>
</nav>

<section class="recruiter">
  <h2>Find Candidates</h2>

  <form class="search-row" onsubmit="findCandidates(event)">
    <input type="text" id="skills" placeholder="Enter skills (comma separated), e.g. python, sql">
    <input type="number" id="experience" min="0" placeholder="Min. experience (years)">
    <button type="submit" class="btn-primary">Search</button>
  </form>

  <p id="search-msg" class="msg"></p>
  <div id="candidates" class="candidate-grid"></div>
</section>

<script src="script.js"></script>
</body>
</html>
