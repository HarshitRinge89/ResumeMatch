<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | ResumeMatch</title>
  <link rel="stylesheet" href="login.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1870/1870080.png">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo">ResumeMatch</div>
  <div class="nav-buttons">
    <a href="index.html" class="nav-button">Home</a>
  </div>
</nav>

<section class="auth-section">
  <div class="auth-box">

    <h2 id="form-title">Sign Up</h2>
    <p class="sub-text">Create your account to get started.</p>

    <form id="auth-form">

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" required>
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" required>
      </div>

      <div class="input-group">
        <label>Sign up as</label>
        <select id="role">
          <option value="applicant">Applicant</option>
          <option value="recruiter">Recruiter</option>
        </select>
      </div>

      <button type="submit" class="btn-primary full">Sign Up</button>

      <p class="switch">
        Already have an account?
        <span onclick="toggleForm()">Login</span>
      </p>

    </form>
  </div>
</section>

<script src="auth.js"></script>
</body>
</html>
